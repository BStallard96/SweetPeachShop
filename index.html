<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sweet Peach Shop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="cream-background">
    <nav class="navbar">
      <a href="index.html" class="logo">
        <img src="images/logo5.png" alt="Sweet Peach Shop logo" />
      </a>

      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="shop.html">Shop</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
      <a href="cart.html" class="cart-link" aria-label="View shopping cart">
        <svg
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          aria-hidden="true"
        >
          <path d="M2 3h3l3 12h11l3-9H6" />
          <circle cx="9" cy="20" r="1" />
          <circle cx="18" cy="20" r="1" />
        </svg>
      </a>
    </nav>

    <main class="container">
      <section class="hero">
        <img
          src="images/hero.png"
          alt="Handmade flower earrings displayed on a ceramic plate"
        />

        <div class="hero-text">
          <h1>Handmade Polymer Clay Earrings</h1>
          <p>Lightweight, handmade, and made with love.</p>
          <a href="shop.html" class="shop-button">Shop Now</a>
        </div>
      </section>
    </main>
  </body>
</html>
