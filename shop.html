<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Shop | Sweet Peach Shop</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <script src="shop.js" defer></script>
  </head>

  <body>
    <nav class="navbar">
      <a href="index.html" class="logo">
        <img src="images/logo5.png" alt="Sweet Peach Shop logo" />
      </a>

      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="shop.html">Shop</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>

    <main class="container shop-page">
      <h1>Shop All Earrings</h1>
      <p>Browse our handmade earrings.</p>
      <p>Items in cart: <span id="cart-count">0</span></p>
      <div class="product-grid">
        <article class="product-card">
          <img
            src="images/pumpkin-dangles.jpg"
            alt="Orange pumpkin dangle earrings with gold-colored hooks"
          />
          <h2>Pumpkin Dangles</h2>
          <p>$8.00</p>
          <button type="button" class="add-to-cart">Add to Cart</button>
        </article>
        <article class="product-card">
          <img
            src="images/pumpkin-studs.jpg"
            alt="Orange pumpkin stud earrings on a display card"
          />
          <h2>Pumpkin Studs</h2>
          <p>$6.00</p>
          <button type="button" class="add-to-cart">Add to Cart</button>
        </article>

        <article class="product-card">
          <img
            src="images/acorn-studs.jpg"
            alt="Acorn stud earrings with brown textured tops and tan bottoms"
          />
          <h2>Acorn Studs</h2>
          <p>$6.00</p>
          <button type="button" class="add-to-cart">Add to Cart</button>
        </article>
      </div>
    </main>
  </body>
</html>
